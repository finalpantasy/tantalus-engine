[workspace]
members = [
    "crates/tantalus-assets",
    "crates/tantalus-client",
    "crates/tantalus-contracts",
    "crates/tantalus-core",
    "crates/tantalus-game",
    "crates/tantalus-legacy",
    "crates/tantalus-tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
