[workspace]
members = [
    "crates/tantalus-assets",
    "crates/tantalus-client",
    "crates/tantalus-contracts",
    "crates/tantalus-core",
    "crates/tantalus-game",
    "crates/tantalus-legacy",
    "crates/tantalus-mods",
    "crates/tantalus-tools",
    "sdk/rust/tantalus-sdk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
