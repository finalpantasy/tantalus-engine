[package]
name = "tantalus-client"
description = "Private Bevy presentation backend for Tantalus Engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["default_app", "default_platform", "2d_bevy_render", "3d_bevy_render", "png", "multi_threaded"] }
crossbeam-channel = "0.5"
serde.workspace = true
tantalus-contracts = { path = "../tantalus-contracts" }
tantalus-core = { path = "../tantalus-core" }

[dev-dependencies]
image = "0.25"
serde_json.workspace = true
tempfile = "3"
